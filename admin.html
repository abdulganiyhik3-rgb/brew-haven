<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew Haven Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-wrapper">
            <h2 class="logo-name">Brew Haven</h2>
            <img class="logo" src="./img/coffee.png" alt="Brew Haven">
        </div>
        <a class="admin-home-link" href="/">View website</a>
    </header>
    <main class="admin-page">
        <h1>Brew Haven Admin</h1>
        <form id="admin-access">
            <label for="admin-email">Admin email</label>
            <input id="admin-email" name="email" type="email" autocomplete="username" required>
            <label for="admin-password">Password</label>
            <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
        </form>
        <p id="admin-message" role="status" aria-live="polite"></p>
        <div id="admin-dashboard" hidden>
            <button id="admin-sign-out" type="button">Sign out</button>
            <section>
                <h2>Sales</h2>
                <p id="sales-summary"></p>
                <div id="sales"></div>
            </section>
            <section>
                <h2>Products and prices</h2>
                <form id="product-form" class="admin-form">
                    <input name="name" maxlength="100" placeholder="Product name" required>
                    <input name="description" maxlength="1000" placeholder="Description" required>
                    <input name="image_url" maxlength="500" placeholder="Image URL" required>
                    <input name="price" type="number" min="0" step="0.01" placeholder="Price" required>
                    <button type="submit">Add product</button>
                </form>
                <div id="products" class="admin-list"></div>
            </section>
            <section>
                <h2>Posts</h2>
                <form id="post-form" class="admin-form">
                    <input name="title" maxlength="150" placeholder="Post title" required>
                    <input name="author" maxlength="100" placeholder="Author" value="Brew Haven" required>
                    <textarea name="content" maxlength="5000" placeholder="Post content" required></textarea>
                    <button type="submit">Publish post</button>
                </form>
                <div id="posts" class="admin-list"></div>
            </section>
            <section>
                <h2>Orders</h2>
                <div id="orders" class="admin-list"></div>
            </section>
        </div>
    </main>
    <script type="module" src="admin.js"></script>
</body>
</html>
